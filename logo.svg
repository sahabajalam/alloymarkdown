<svg width="100%" height="100%" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" /> <!-- Indigo-500 -->
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" /> <!-- Purple-500 -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Main Hexagon Shape -->
  <path d="M256 32 L474 145 V367 L256 480 L38 367 V145 Z" 
        fill="url(#grad1)" 
        stroke="none" />
        
  <!-- Inner "A" / Markdown Arrow Shape (lighter/white overlay for contrast) -->
